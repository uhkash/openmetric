# ---------------------------------------------------------------------------
# OpenMetric built-in catalog: providers + list prices.
#
# Prices are community-maintained and WILL drift. OpenMetric always prefers the
# cost reported by the provider itself when the API returns one (OpenRouter
# does); the numbers here are the fallback so you still see a number instead of
# a blank. Anything OpenMetric cannot price is reported as "unpriced spend"
# under Blindspots rather than silently counted as $0.
#
# Override or extend without touching this file:  ./pricing.local.yaml
# (see `openmetric price set --help`)
#
# token_prices are USD per 1,000,000 tokens.
# ---------------------------------------------------------------------------
version: 1
updated: "2026-09-01"

providers:
  openrouter:
    name: OpenRouter
    base_url: https://openrouter.ai/api/v1
    kind: llm
    auth_style: bearer
    env_var: OPENROUTER_API_KEY
    prefers_upstream_cost: true
  openai:
    name: OpenAI
    base_url: https://api.openai.com/v1
    kind: llm
    auth_style: bearer
    env_var: OPENAI_API_KEY
  anthropic:
    name: Anthropic
    base_url: https://api.anthropic.com/v1
    kind: llm
    auth_style: header
    auth_header: x-api-key
    env_var: ANTHROPIC_API_KEY
  groq:
    name: Groq
    base_url: https://api.groq.com/openai/v1
    kind: llm
    auth_style: bearer
    env_var: GROQ_API_KEY
  deepseek:
    name: DeepSeek
    base_url: https://api.deepseek.com
    kind: llm
    auth_style: bearer
    env_var: DEEPSEEK_API_KEY
  mistral:
    name: Mistral
    base_url: https://api.mistral.ai/v1
    kind: llm
    auth_style: bearer
    env_var: MISTRAL_API_KEY
  together:
    name: Together AI
    base_url: https://api.together.xyz/v1
    kind: llm
    auth_style: bearer
    env_var: TOGETHER_API_KEY
  perplexity:
    name: Perplexity
    base_url: https://api.perplexity.ai
    kind: llm
    auth_style: bearer
    env_var: PERPLEXITY_API_KEY

  firecrawl:
    name: Firecrawl
    base_url: https://api.firecrawl.dev
    kind: scrape
    auth_style: bearer
    env_var: FIRECRAWL_API_KEY
    # Credit-based plans differ per account - set your own effective rate:
    #   openmetric price set firecrawl --per-request 0.002
    unit_price_usd: null
    unit_kind: request
  serper:
    name: Serper
    base_url: https://google.serper.dev
    kind: search
    auth_style: header
    auth_header: X-API-KEY
    env_var: SERPER_API_KEY
    unit_price_usd: null
    unit_kind: request
  tavily:
    name: Tavily
    base_url: https://api.tavily.com
    kind: search
    auth_style: bearer
    env_var: TAVILY_API_KEY
    unit_price_usd: null
    unit_kind: request
  exa:
    name: Exa
    base_url: https://api.exa.ai
    kind: search
    auth_style: header
    auth_header: x-api-key
    env_var: EXA_API_KEY
    unit_price_usd: null
    unit_kind: request
  scrapingbee:
    name: ScrapingBee
    base_url: https://app.scrapingbee.com/api/v1
    kind: scrape
    auth_style: query
    auth_query_param: api_key
    env_var: SCRAPINGBEE_API_KEY
    unit_price_usd: null
    unit_kind: request
  apify:
    name: Apify
    base_url: https://api.apify.com/v2
    kind: scrape
    auth_style: bearer
    env_var: APIFY_API_KEY
    unit_price_usd: null
    unit_kind: request
  resend:
    name: Resend
    base_url: https://api.resend.com
    kind: other
    auth_style: bearer
    env_var: RESEND_API_KEY
    unit_price_usd: null
    unit_kind: request

# Model rates. Keys are matched exactly first, then by the part after the last
# "/" (so OpenRouter's "anthropic/claude-sonnet-4" finds "claude-sonnet-4"),
# then by longest matching prefix pattern ending in "*".
token_prices:
  # --- OpenAI ---
  gpt-4o: { input: 2.50, output: 10.00, cached_input: 1.25 }
  gpt-4o-mini: { input: 0.15, output: 0.60, cached_input: 0.075 }
  gpt-4.1: { input: 2.00, output: 8.00, cached_input: 0.50 }
  gpt-4.1-mini: { input: 0.40, output: 1.60, cached_input: 0.10 }
  gpt-4.1-nano: { input: 0.10, output: 0.40, cached_input: 0.025 }
  o3-mini: { input: 1.10, output: 4.40, cached_input: 0.55 }
  text-embedding-3-small: { input: 0.02, output: 0.0 }
  text-embedding-3-large: { input: 0.13, output: 0.0 }

  # --- Anthropic ---
  claude-opus-4: { input: 15.00, output: 75.00 }
  claude-sonnet-4: { input: 3.00, output: 15.00 }
  claude-3-5-sonnet: { input: 3.00, output: 15.00 }
  claude-3-5-haiku: { input: 0.80, output: 4.00 }
  claude-3-haiku: { input: 0.25, output: 1.25 }

  # --- Google ---
  gemini-2.0-flash: { input: 0.10, output: 0.40 }
  gemini-1.5-pro: { input: 1.25, output: 5.00 }
  gemini-1.5-flash: { input: 0.075, output: 0.30 }

  # --- Open-weight / hosted ---
  deepseek-chat: { input: 0.27, output: 1.10 }
  llama-3.3-70b-versatile: { input: 0.59, output: 0.79 }
  mistral-large-latest: { input: 2.00, output: 6.00 }

  # --- Prefix fallbacks (lowest precedence) ---
  "gpt-4o*": { input: 2.50, output: 10.00 }
  "claude-3-5-sonnet*": { input: 3.00, output: 15.00 }
  "claude-sonnet*": { input: 3.00, output: 15.00 }
  "gemini-2.0*": { input: 0.10, output: 0.40 }
