name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest -q

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # This project is a credential store, so a leaked secret in history is the
      # worst thing that could happen to it. Scan every commit, every time.
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest \
            detect --source=/repo --config=/repo/.gitleaks.toml \
            --redact --verbose --no-banner

  smoke:
    name: End-to-end smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install -e .

      - name: Set up, seed and query
        run: |
          openmetric init
          openmetric demo --events 500 --days 14
          openmetric report --by project
          openmetric report --by use_case
          openmetric blindspots
          openmetric export --out /tmp/export.csv
          test -s /tmp/export.csv

      - name: Serve and check the dashboard responds
        run: |
          openmetric serve --port 8099 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8099/api/health && break
            sleep 1
          done
          curl -sf http://127.0.0.1:8099/ > /dev/null
          curl -sf http://127.0.0.1:8099/api/blindspots > /dev/null
          curl -sf "http://127.0.0.1:8099/api/analytics/matrix?rows_by=project&cols_by=provider" > /dev/null

      - name: Fail if the run produced a committable secret
        run: |
          git status --porcelain
          test -z "$(git status --porcelain | grep -E '\.env$|\.db$' || true)"
